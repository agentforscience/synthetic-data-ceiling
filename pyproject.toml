[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "peft>=0.21.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "vllm>=0.5.0.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
